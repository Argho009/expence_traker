<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Sign Up - Campus Expense Tracker</title>
  <meta name="description" content="Sign in or create a student account to manage daily expenses and track monthly budgets.">
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 40%);
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.25rem;
      border-radius: var(--radius-lg);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.75rem;
      background: linear-gradient(135deg, var(--primary-color), #8b5cf6);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.75rem;
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .auth-title {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .auth-tabs {
      display: flex;
      background: rgba(226, 232, 240, 0.5);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 1.5rem;
    }

    body.dark-mode .auth-tabs {
      background: rgba(255, 255, 255, 0.06);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: var(--shadow-sm);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .forgot-pass {
      color: var(--primary-color);
      font-weight: 500;
    }

    .toggle-auth-text {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .toggle-auth-link {
      color: var(--primary-color);
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-wallet"></i>
        </div>
        <h1 class="auth-title">Campus Track</h1>
        <p class="auth-subtitle">Student Expense & Budget Discipline</p>
      </div>

      <!-- Sign In vs Sign Up Tabs -->
      <div class="auth-tabs">
        <button id="tab-signin" class="auth-tab-btn active"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <button id="tab-signup" class="auth-tab-btn"><i class="fas fa-user-plus"></i> Sign Up</button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="signin-form">
        <div class="form-group">
          <label class="form-label" for="signin-username">Username or Email</label>
          <input type="text" id="signin-username" class="form-control" placeholder="Enter your username or email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signin-password">Password</label>
          <input type="password" id="signin-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-pass" onclick="alert('Enter your registered username to sign in.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
          <i class="fas fa-arrow-right"></i> Sign In to Dashboard
        </button>

        <div class="toggle-auth-text">
          Don't have an account? <span class="toggle-auth-link" id="link-goto-signup">Sign Up</span>
        </div>
      </form>

      <!-- SIGN UP FORM (Hidden by default) -->
      <form id="signup-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="signup-fullname">Full Name *</label>
          <input type="text" id="signup-fullname" class="form-control" placeholder="e.g. Jordan Smith" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">College Email *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="jordan@campus.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-username">Username *</label>
          <input type="text" id="signup-username" class="form-control" placeholder="jordan_smith" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-college">College / Institution</label>
          <input type="text" id="signup-college" class="form-control" placeholder="State University">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.75rem;">
          <div class="form-group">
            <label class="form-label" for="signup-password">Password *</label>
            <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-budget">Monthly Budget (₹)</label>
            <input type="number" id="signup-budget" class="form-control" placeholder="5000" min="100" value="5000">
          </div>
        </div>

        <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
          <i class="fas fa-user-check"></i> Create Account & Sign In
        </button>

        <div class="toggle-auth-text">
          Already have an account? <span class="toggle-auth-link" id="link-goto-signin">Sign In</span>
        </div>
      </form>
    </div>
  </div>

  <!-- App Core JS -->
  <script src="js/storage.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Auto-wipe any legacy dummy session data from previous loads
    if (localStorage.getItem('campusExpenseTrackerData')) {
      const data = JSON.parse(localStorage.getItem('campusExpenseTrackerData'));
      if (data.user && data.user.username === 'alex_student') {
        localStorage.removeItem('campusExpenseTrackerData');
      }
    }
  </script>
</body>
</html>
